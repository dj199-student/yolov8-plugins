[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "yolov8-plugins"
version = "1.0.0"
description = "YOLOv8 plugin-based extension project with 30+ attention, convolution, transformer, neck, SPP, and head modules. Includes a Tkinter desktop GUI for training, detection, validation, export, and benchmarking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "YOLOv8 Plugins Contributors"},
]
keywords = [
    "yolov8",
    "object-detection",
    "instance-segmentation",
    "pose-estimation",
    "attention-mechanism",
    "deep-learning",
    "computer-vision",
    "ultralytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.7.0",
]
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxslim>=0.1.0",
]
dev = [
    "ipykernel",
    "jupyter",
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["models", "utils", "scripts"]
