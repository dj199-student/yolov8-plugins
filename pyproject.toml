[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov8-plugins"
version = "1.0.0"
description = "YOLOv8 plugin-based extension project with 30+ attention, convolution, transformer, neck, SPP, and head modules. Includes a Tkinter desktop GUI for training, detection, validation, export, and benchmarking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "YOLOv8 Plugins Contributors"},
]
keywords = [
    "yolov8",
    "object-detection",
    "instance-segmentation",
    "pose-estimation",
    "attention-mechanism",
    "deep-learning",
    "computer-vision",
    "ultralytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies (minimal set for basic usage)
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Full installation: pip install "yolov8-plugins[full]"
full = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxslim>=0.1.0",
]
gui = [
    "matplotlib>=3.7.0",
]
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxslim>=0.1.0",
]
dev = [
    "ipykernel",
    "jupyter",
    "pytest>=7.0",
]

[project.scripts]
yolo-train = "scripts.train:main"
yolo-detect = "scripts.detect:main"
yolo-val = "scripts.val:main"
yolo-export = "scripts.export:main"
yolo-benchmark = "scripts.benchmark:main"

[project.urls]
Homepage = "https://github.com/dj199-student/yolov8-plugins"
Repository = "https://github.com/dj199-student/yolov8-plugins.git"
Issues = "https://github.com/dj199-student/yolov8-plugins/issues"
Changelog = "https://github.com/dj199-student/yolov8-plugins/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["models", "utils", "scripts"]
